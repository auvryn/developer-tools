# Publishes one package to npm with Trusted Publishing (OIDC, no npm token) and
# provenance. Triggered by a tag: sdk-v0.1.0, cli-v0.1.0 or mcp-v0.1.0. The
# tarball that is tested here is the one that is published.
name: Publish

on:
  push:
    tags: ['sdk-v*', 'cli-v*', 'mcp-v*']

permissions:
  contents: read
  id-token: write # npm Trusted Publishing (OIDC) and provenance

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: npm 11.5.1 or later (Trusted Publishing)
        run: npm install --global npm@^11.5.1 && npm --version

      - name: Which package, and does the tag match its version?
        id: target
        run: |
          tag="${GITHUB_REF_NAME}"
          short="${tag%%-v*}"
          version="${tag#*-v}"
          dir="packages/${short}"
          test -f "${dir}/package.json" || { echo "Unknown package in tag ${tag}"; exit 1; }
          actual="$(node -p "require('./${dir}/package.json').version")"
          test "${actual}" = "${version}" || { echo "Tag ${version} != package.json ${actual}"; exit 1; }
          echo "dir=${dir}" >> "$GITHUB_OUTPUT"
          echo "name=$(node -p "require('./${dir}/package.json').name")" >> "$GITHUB_OUTPUT"

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

      - name: Pack
        id: pack
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          pnpm --dir "${{ steps.target.outputs.dir }}" pack --pack-destination "$RUNNER_TEMP/pack"
          echo "tarball=$(ls "$RUNNER_TEMP"/pack/*.tgz)" >> "$GITHUB_OUTPUT"

      - name: Smoke test the tarball from a clean directory
        run: |
          mkdir -p "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke"
          npm init --yes > /dev/null
          npm install --no-audit --no-fund "${{ steps.pack.outputs.tarball }}"
          case "${{ steps.target.outputs.name }}" in
            @auvryn/sdk) node --input-type=module -e "import { Auvryn, DEFAULT_BASE_URL } from '@auvryn/sdk'; if (typeof Auvryn !== 'function' || DEFAULT_BASE_URL !== 'https://api.auvrynspace.com') process.exit(1);" ;;
            @auvryn/cli) npx --no-install auvryn --version ;;
            @auvryn/mcp) if npx --no-install auvryn-mcp < /dev/null 2> err.txt; then exit 1; fi; grep -q AUVRYN_API_KEY err.txt ;;
          esac

      - name: Publish (Trusted Publishing; provenance is automatic)
        run: npm publish "${{ steps.pack.outputs.tarball }}" --access public
