name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - name: Nothing tracked changed (lockfile, generated files)
        run: git diff --exit-code
      - name: Release guard (packed tarballs, secrets, non-public names, links, production default)
        run: node scripts/verify-packages.mjs
      - name: Registry E2E scripts parse
        run: for f in e2e/registry/*.mjs; do node --check "$f"; done
